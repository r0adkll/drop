openapi: 3.1.0
info:
  title: Drop
  version: 0.0.0
  description: >
    The Drop server API. This document is the single definition of the API: the server's types and
    the Kotlin client are generated from it (ADR 0008).
servers:
  - url: https://drop.example.com
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Reports that the server is up.
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/uploads:
    post:
      operationId: createUpload
      summary: Starts uploading a Build.
      description: >
        Reserves the Build's ID and returns presigned URLs to `PUT` its files to directly. Nothing is
        offered until `completeUpload` confirms the files. A run uploads at most one Build per
        Product: an upload in flight from the same run is replaced, and a confirmed Build is replaced
        only by a later run attempt, which keeps its ID and keeps serving the earlier attempt's file
        until the later one is confirmed (ADR 0013).
      security:
        - githubOidc: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: The upload has started; `PUT` its files to the returned URLs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUploadResponse"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/uploads/{buildId}/complete:
    post:
      operationId: completeUpload
      summary: Confirms a Build's files and makes it available.
      description: >
        Checks the uploaded APK's size, and its SHA-256 when storage reports one, then makes the Build
        available, replacing the earlier attempt's files if it had any. Must be called with a token from the same run attempt that created the upload.
        Completing an already confirmed Build succeeds without changing it.
      security:
        - githubOidc: []
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BuildId"
      responses:
        "200":
          description: The Build is uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadedBuild"
        default:
          $ref: "#/components/responses/Error"
  /api/v1/update:
    get:
      operationId: checkForUpdate
      summary: Asks whether a newer Build exists for an installed Build (an Update check).
      description: >
        The SDK sends what the installed Build is: its Product, its Channel, the run ID from its
        Stamp (left out by a Build with no Stamp), its Signer and its version code. Newer means a
        higher run ID on the same Channel (ADR 0009), whether or not the stamped run uploaded a
        Build; without a Stamp every Build on the Channel counts as newer (ADR 0013). Only Builds
        with the installed Signer are offered as Updates (ADR 0006). Responses are never cached.
      parameters:
        - name: applicationId
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ApplicationId"
        - name: channel
          in: query
          required: true
          description: The Channel from the Stamp, or from the app's Drop configuration without one.
          schema:
            $ref: "#/components/schemas/ChannelName"
        - name: runId
          in: query
          required: false
          description: The GitHub Actions run ID from the installed Build's Stamp.
          schema:
            type: integer
            minimum: 1
        - name: signer
          in: query
          required: true
          description: The SHA-256 digest of the installed app's signing certificate.
          schema:
            $ref: "#/components/schemas/Sha256"
        - name: versionCode
          in: query
          required: true
          description: The installed app's version code.
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: >
            The answer. `404 product_not_found` when the deployment has no such Product, and `403
            sign_in_required` for a Private product, which milestone 1 doesn't serve.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCheck"
        default:
          $ref: "#/components/responses/Error"
  /b/{buildId}:
    get:
      operationId: getBuildPage
      summary: The Build page.
      description: >
        Server-rendered HTML (docs/design.md#build-pages): the Build with its QR code and install
        button, or its expired state. A Build of a Private product gets a sign-in placeholder (403)
        until milestone 2, and an unknown ID a not-found page (404). Served with a Content Security
        Policy that allows nothing beyond the page itself.
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BuildId"
      responses:
        "200":
          description: The Build page, available or expired.
          content:
            text/html:
              schema:
                type: string
        "403":
          description: The Build belongs to a Private product.
          content:
            text/html:
              schema:
                type: string
        "404":
          description: There is no such Build.
          content:
            text/html:
              schema:
                type: string
  /b/{buildId}/download:
    get:
      operationId: downloadBuild
      summary: The Build's APK.
      description: >
        Streams the APK as an attachment. Supports a single byte range with If-Range, so interrupted
        downloads resume; a range against a file that has since been replaced gets the whole file.
        Unavailable for expired Builds and Private products.
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BuildId"
        - name: Range
          in: header
          required: false
          schema:
            type: string
            example: bytes=1048576-
        - name: If-Range
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The whole APK.
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary
        "206":
          description: The requested range of the APK.
          content:
            application/vnd.android.package-archive:
              schema:
                type: string
                format: binary
        "304":
          description: The APK matches If-None-Match.
        "416":
          description: The range lies outside the APK.
        default:
          $ref: "#/components/responses/Error"
  /b/{buildId}/qr.svg:
    get:
      operationId: getBuildQrCode
      summary: A QR code of the Build page URL.
      description: >
        Black on white with a quiet zone, for pull request comments and the Build page. Served for
        expired Builds too; it never changes, so it may be cached forever.
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BuildId"
      responses:
        "200":
          description: The QR code.
          content:
            image/svg+xml:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"
  /b/{buildId}/icon:
    get:
      operationId: getBuildIcon
      summary: The Build's app icon.
      description: >
        The icon the Action uploaded, or the Product's icon from the deployment config, kept after
        the Build expires. A later attempt of the run may replace it.
      parameters:
        - name: buildId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/BuildId"
      responses:
        "200":
          description: The icon.
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"
  /favicon.svg:
    get:
      operationId: getFavicon
      summary: Drop's own icon.
      description: The favicon of every Build page.
      responses:
        "200":
          description: The icon.
          content:
            image/svg+xml:
              schema:
                type: string
  /api/v1/github/webhook:
    post:
      operationId: receiveGitHubWebhook
      summary: Receives the deployment's GitHub App webhooks.
      description: >
        Called by GitHub, signed with the App's webhook secret. Drop records the installations of
        listed Owners from `installation` and `installation_repositories` events (ADR 0004), and
        ends a pull request's Channels and notes it in its comment on `pull_request` `closed`. Every
        other event, and events from accounts that aren't listed Owners, are answered as ignored.
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-Hub-Signature-256
          in: header
          required: true
          description: "`sha256=` and the hex HMAC-SHA256 of the body under the webhook secret."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: The event was verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    githubOidc:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        A GitHub Actions OIDC token whose audience is the deployment's URL.
  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          description: A human-readable explanation. Not stable; do not match on it.
          type: string
    ErrorCode:
      description: >
        A stable, machine-readable reason. New codes may be added; clients treat an unknown code as
        a generic failure.
      type: string
      enum:
        - not_found
        - internal
        - invalid_request
        - token_missing
        - token_invalid
        - owner_not_listed
        - app_not_installed
        - repository_not_selected
        - webhook_signature_invalid
        - event_not_allowed
        - product_bound_to_other_repository
        - channel_invalid
        - channel_ref_mismatch
        - channel_ended
        - default_branch_ref_invalid
        - build_exists_for_run
        - build_not_found
        - build_run_mismatch
        - file_missing
        - file_size_mismatch
        - file_checksum_mismatch
        - product_not_found
        - sign_in_required
    WebhookResult:
      type: object
      additionalProperties: false
      required: [result]
      properties:
        result:
          description: Whether Drop recorded anything from the event.
          type: string
          enum: [applied, ignored]
    ApplicationId:
      description: An Android application ID, which is the Product (ADR 0015).
      type: string
      maxLength: 255
      pattern: "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$"
    ChannelName:
      type: string
      maxLength: 64
      pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
    UpdateCheck:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          description: >
            `up_to_date`: no newer Build. `update`: `update` is newer, with the installed Signer.
            `channel_ended`: the Channel's pull request has closed; `update` is the default
            Channel's newest Build to switch to (the installed Signer's newest, else the newest,
            flagged `requiresReinstall: signer`), or null when it has none. `reinstall_required`: every newer Build has a different Signer; `update` is the
            newest of them.
          type: string
          enum: [up_to_date, update, channel_ended, reinstall_required]
        update:
          oneOf:
            - $ref: "#/components/schemas/Update"
            - type: "null"
    Update:
      description: A Build offered to an installed Build.
      type: object
      additionalProperties: false
      required: [buildId, channel, label, versionName, versionCode, uploadedAt, headline, commitSha, pullRequest, buildUrl, fileSize, fileSha256, downloadUrl, downloadUrlExpiresAt]
      properties:
        buildId:
          $ref: "#/components/schemas/BuildId"
        channel:
          $ref: "#/components/schemas/ChannelName"
        label:
          description: The app's name as Drop shows it.
          type: string
        versionName:
          type: [string, "null"]
        versionCode:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        headline:
          description: >
            What changed, as the Build page's headline: the pull request title, else the commit
            message's first line, else the app's name.
          type: string
        commitSha:
          type: string
        pullRequest:
          description: The pull request number on a Pull request channel.
          type: [integer, "null"]
        buildUrl:
          type: string
          format: uri
        fileSize:
          description: The APK's size in bytes.
          type: integer
        fileSha256:
          description: The APK's SHA-256, to verify before installing.
          allOf:
            - $ref: "#/components/schemas/Sha256"
        downloadUrl:
          type: string
          format: uri
        downloadUrlExpiresAt:
          description: >
            When `downloadUrl` stops working; check again for a fresh one after this. It resumes
            with a `Range` request until then.
          type: string
          format: date-time
        requiresReinstall:
          description: >
            Why the Update can't install over the installed Build: `version_code` when its version
            code is lower (Android refuses a downgrade), `signer` when it is signed differently.
            Either way the Tester must uninstall first, which loses the app's data.
          type: string
          enum: [version_code, signer]
    BuildId:
      description: 8 random base62 characters.
      type: string
      pattern: "^[0-9A-Za-z]{8}$"
    Sha256:
      description: A SHA-256 digest in lowercase hex.
      type: string
      pattern: "^[0-9a-f]{64}$"
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [applicationId, versionCode, signerSha256, apk, channel, defaultBranch, commit]
      properties:
        applicationId:
          description: The APK's package name, which is the Product (ADR 0015).
          type: string
          maxLength: 255
          pattern: "^[A-Za-z][A-Za-z0-9_]*(\\.[A-Za-z][A-Za-z0-9_]*)+$"
        versionCode:
          type: integer
          minimum: 1
          maximum: 2100000000
        versionName:
          type: string
          maxLength: 100
        label:
          description: The APK's application label.
          type: string
          maxLength: 200
        signerSha256:
          description: The SHA-256 digest of the APK's signing certificate (ADR 0006).
          allOf:
            - $ref: "#/components/schemas/Sha256"
        apk:
          $ref: "#/components/schemas/FileDescriptor"
        icon:
          $ref: "#/components/schemas/IconDescriptor"
        channel:
          description: >
            The Channel to upload to. `pr/<number>` is a Pull request channel and must come from a
            run of that pull request.
          type: string
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._/-]*$"
        defaultBranch:
          description: >
            Whether the run is on the repository's default branch, making `channel` the Product's
            default Channel.
          type: boolean
        commit:
          $ref: "#/components/schemas/CommitInfo"
        pullRequestTitle:
          type: string
          maxLength: 1000
    FileDescriptor:
      type: object
      additionalProperties: false
      required: [size, sha256]
      properties:
        size:
          description: Size in bytes.
          type: integer
          minimum: 1
          maximum: 5000000000
        sha256:
          $ref: "#/components/schemas/Sha256"
    IconDescriptor:
      type: object
      additionalProperties: false
      required: [size, sha256, contentType]
      properties:
        size:
          type: integer
          minimum: 1
          maximum: 1048576
        sha256:
          $ref: "#/components/schemas/Sha256"
        contentType:
          type: string
          enum: [image/png, image/webp]
    CommitInfo:
      type: object
      additionalProperties: false
      required: [sha]
      properties:
        sha:
          description: >
            The commit to show: the pull request's head commit on `pull_request` runs, otherwise the
            commit that was built.
          type: string
          pattern: "^[0-9a-f]{40}$"
        message:
          type: string
          maxLength: 10000
    PresignedUpload:
      type: object
      additionalProperties: false
      required: [url, method, headers]
      properties:
        url:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          description: Headers the `PUT` must send exactly, because they are part of the signature.
          type: object
          additionalProperties:
            type: string
    CreateUploadResponse:
      type: object
      additionalProperties: false
      required: [buildId, buildUrl, expiresAt, apk]
      properties:
        buildId:
          $ref: "#/components/schemas/BuildId"
        buildUrl:
          description: The Build page.
          type: string
          format: uri
        expiresAt:
          description: When the presigned URLs stop working.
          type: string
          format: date-time
        apk:
          $ref: "#/components/schemas/PresignedUpload"
        icon:
          $ref: "#/components/schemas/PresignedUpload"
    UploadedBuild:
      type: object
      additionalProperties: false
      required: [buildId, buildUrl]
      properties:
        buildId:
          $ref: "#/components/schemas/BuildId"
        buildUrl:
          type: string
          format: uri
