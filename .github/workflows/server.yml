name: Server

on:
  push:
    branches: [main]
    paths:
      - server/**
      - drop.config.json
      - drop.config.schema.json
      - drop.config.lock.json
      - deploy/**
      - deployment/**
      - .github/workflows/server.yml
  pull_request:
    paths:
      - server/**
      - drop.config.json
      - drop.config.schema.json
      - drop.config.lock.json
      - deploy/**
      - deployment/**
      - .github/workflows/server.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.nvmrc
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check:config
      - run: npm run check:generated
      - run: npm run check:typegen
      - run: npm run typecheck
      - run: npm test
