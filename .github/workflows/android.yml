name: Android

on:
  push:
    branches: [main]
    paths:
      - android/**
      - server/openapi.yaml
      - action/**
      - .github/workflows/android.yml
  pull_request:
    paths:
      - android/**
      - server/openapi.yaml
      - action/**
      - .github/workflows/android.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and test
        run: >
          ./gradlew
          :plugin:test
          :drop-core:testAndroidHostTest
          :drop-android:testDebugUnitTest
          :drop-android:assembleRelease
          :drop-noop:assembleRelease
          :drop-ui:assembleRelease
          :sample:assembleDebug
          :sample:assembleRelease
        env:
          # The sample's Update checks go to this deployment, when the repository sets one.
          DROP_SERVER: ${{ vars.DROP_SERVER }}
      - name: Check drop-noop's API matches drop-android's
        run: ./scripts/check-noop-api.sh
      - name: Check store variants never ask to install packages
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          "$aapt2" dump permissions sample/build/outputs/apk/debug/sample-debug.apk | grep -q REQUEST_INSTALL_PACKAGES
          ! "$aapt2" dump permissions sample/build/outputs/apk/release/sample-release-unsigned.apk | grep -q REQUEST_INSTALL_PACKAGES
      - uses: actions/upload-artifact@v4
        with:
          name: sample-apk
          path: android/sample/build/outputs/apk/debug/sample-debug.apk

  # Dogfoods Drop: uploads the sample to the deployment named by the DROP_SERVER repository
  # variable, so its Update loop can be tried on a phone. Skipped without one, and for forks,
  # which can't get an OIDC token.
  upload-sample:
    needs: build
    if: vars.DROP_SERVER != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: sample-apk
      - uses: ./action
        with:
          server: ${{ vars.DROP_SERVER }}
          apk: sample-debug.apk

  # Every push to main publishes the SDK and the Gradle plugin as VERSION_NAME's -SNAPSHOT to Maven
  # Central's snapshot repository (docs/design.md#releases). Skipped until the credentials exist.
  publish-snapshot:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_SNAPSHOTS == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Publish snapshots
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          grep -q '^VERSION_NAME=.*-SNAPSHOT$' gradle.properties || { echo "::error::VERSION_NAME isn't a snapshot."; exit 1; }
          ./gradlew --no-configuration-cache publishToMavenCentral :plugin:publishToMavenCentral
