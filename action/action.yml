name: Drop
description: Upload an Android Build to a Drop deployment.
author: r0adkll
branding:
  icon: download-cloud
  color: green
inputs:
  server:
    description: The Drop deployment's URL, such as https://drop.example.com.
    required: true
  apk:
    description: Path to the signed APK to upload.
    required: true
  channel:
    description: >
      The Channel to upload to. Defaults to the job's `DROP_CHANNEL` environment variable, which the
      Gradle plugin also stamps into the APK, then to `main` for runs on the default branch and
      `pr/<number>` for pull requests; any other run must set one.
    required: false
  icon:
    description: >
      A PNG or WebP icon to show for the Build. Defaults to the largest bitmap launcher icon in the
      APK, or to one drawn from its adaptive icon; set this when the Action can't draw that, such
      as an adaptive icon with a gradient.
    required: false
  notes:
    description: >
      Release notes for the Build, up to 4,000 characters of plain text. The first line becomes the
      Build's headline, ahead of the pull request title and commit message, and the rest is shown
      as What's new on the Build page and in the Update sheet.
    required: false
  open-in-app:
    description: >
      A link your app recognises, such as `yourapp://drop/{build}`, for the Build page's Open in App
      button. Drop fills in every `{build}` with the Build's ID; the app reads it and calls
      `drop.check(buildId)` to offer that Build, whichever Channel it follows.
    required: false
outputs:
  build-id:
    description: The uploaded Build's ID.
  build-url:
    description: The uploaded Build's page.
runs:
  using: node24
  main: dist/index.mjs
