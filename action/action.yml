name: Drop
description: Upload an Android Build to a Drop deployment.
author: r0adkll
branding:
  icon: download-cloud
  color: green
inputs:
  server:
    description: The Drop deployment's URL, such as https://drop.example.com.
    required: true
  apk:
    description: Path to the signed APK to upload.
    required: true
  channel:
    description: >
      The Channel to upload to. Defaults to the job's `DROP_CHANNEL` environment variable, which the
      Gradle plugin also stamps into the APK, then to `main` for runs on the default branch and
      `pr/<number>` for pull requests; any other run must set one.
    required: false
  icon:
    description: >
      A PNG or WebP icon to show for the Build. Defaults to the largest bitmap launcher icon in the
      APK, or to one drawn from its adaptive icon; set this when the Action can't draw that, such
      as an adaptive icon with a gradient.
    required: false
outputs:
  build-id:
    description: The uploaded Build's ID.
  build-url:
    description: The uploaded Build's page.
runs:
  using: node24
  main: dist/index.mjs
